<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- CSP: sem scripts/estilos inline. frame-ancestors só funciona por cabeçalho HTTP (veja LEIAME.md). Se mudar a URL em config.js, atualize o connect-src. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://htuzmzqmsacaivaaepyc.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todas as avaliações — Meu Acompanhamento Corporal</title>
  <link rel="icon" href="assets/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="tema-inicial.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="header-actions">
      <span class="user-email" id="usuario-email"></span>
      <button type="button" class="header-btn" id="btn-tema" aria-pressed="false">Tema escuro</button>
      <button type="button" class="header-btn" id="btn-sair">Sair</button>
    </div>
    <div class="container">
      <h1>Todas as avaliações</h1>
      <p class="subtitle">Todas as avaliações que você já salvou, das mais recentes para as mais antigas.</p>
    </div>
  </header>

  <main class="container">
    <p class="notice" id="aviso" role="alert" hidden></p>
    <div class="toolbar">
      <a href="index.html" class="btn btn-primary">&larr; Nova avaliação</a>
      <p class="status" id="contagem" aria-live="polite"></p>
    </div>

    <section id="vazio" class="card empty" hidden>
      <h2>Nenhuma avaliação salva ainda</h2>
      <p>Calcule uma avaliação e clique em “Salvar avaliação” para vê-la aqui.</p>
    </section>

    <section id="lista-avaliacoes" class="saved-list" aria-label="Avaliações salvas"></section>
  </main>

  <footer class="page-footer">
    <p>Seus dados ficam salvos de forma privada na sua conta.</p>
  </footer>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
